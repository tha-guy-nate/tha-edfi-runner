[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tha-edfi-runner"
version = "0.1.2"
description = "A Tabular Helper API library that wraps the Ed-Fi ODS REST API with a typed, pipeline-friendly interface."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nate Wright" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["edfi", "ed-fi", "ods", "education", "api", "tabular", "helper"]
dependencies = [
    "tha-req-runner>=0.2.2",
    "tqdm>=4.68.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "responses>=0.25",
]

[project.urls]
Homepage = "https://github.com/tha-guy-nate/tha-edfi-runner"
Issues = "https://github.com/tha-guy-nate/tha-edfi-runner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tha_edfi_runner"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
